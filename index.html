<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教程中心</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #ffffff;
    color: #1a1a1a;
    line-height: 1.5;
  }

  /* ========== 顶部导航栏 ========== */
  .navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    height: 60px;
    border-bottom: 1px solid #f0f0f0;
    position: sticky;
    top: 0;
    background: #fff;
    z-index: 100;
  }

  .navbar-logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 22px;
    font-weight: 700;
    color: #1a1a1a;
    text-decoration: none;
  }

  .navbar-logo svg { width: 28px; height: 28px; }

  .navbar-tabs {
    display: flex;
    gap: 48px;
  }

  .navbar-tab {
    font-size: 16px;
    color: #666;
    cursor: pointer;
    padding: 4px 0;
    border-bottom: 2px solid transparent;
    transition: color 0.2s;
    text-decoration: none;
  }

  .navbar-tab:hover { color: #1a1a1a; }

  .navbar-tab.active {
    color: #3370ff;
    border-bottom-color: #3370ff;
    font-weight: 600;
  }

  .navbar-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    cursor: pointer;
  }

  /* ========== 主内容区 ========== */
  .container {
    max-width: 1440px;
    margin: 0 auto;
    padding: 32px 40px 60px;
  }

  /* ========== 分区标题 ========== */
  .section-title {
    font-size: 22px;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 20px;
  }

  /* ========== 卡片网格 ========== */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
    margin-bottom: 32px;
  }

  /* ========== 卡片 ========== */
  .card {
    display: block;
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12);
  }

  /* 封面图 - 横向 16:9 */
  .card-cover {
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: #f0f0f0;
    position: relative;
  }

  .card-cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease;
  }

  .card:hover .card-cover img {
    transform: scale(1.05);
  }

  /* 卡片底部文字区 */
  .card-body {
    padding: 14px 16px 16px;
  }

  .card-title {
    font-size: 15px;
    font-weight: 600;
    color: #1a1a1a;
    line-height: 1.45;
    margin-bottom: 12px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: 44px;
  }

  .card-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    color: #999;
  }

  .card-author {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .card-author-avatar {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    flex-shrink: 0;
  }

  .card-date {
    flex-shrink: 0;
  }

  /* ========== 查看全部按钮 ========== */
  .view-all-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 48px;
  }

  .view-all-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 10px 36px;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    font-size: 14px;
    color: #666;
    background: #fff;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s;
  }

  .view-all-btn:hover {
    border-color: #3370ff;
    color: #3370ff;
  }

  /* ========== 响应式 ========== */
  @media (max-width: 1200px) {
    .card-grid { grid-template-columns: repeat(3, 1fr); }
  }

  @media (max-width: 900px) {
    .container { padding: 24px 20px 40px; }
    .navbar { padding: 0 20px; }
    .navbar-tabs { gap: 24px; }
    .card-grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
  }

  @media (max-width: 600px) {
    .navbar-tabs { display: none; }
    .card-grid { grid-template-columns: 1fr; }
    .section-title { font-size: 18px; }
  }
</style>
</head>
<body>

<!-- ===== 顶部导航栏 ===== -->
<nav class="navbar">
  <a href="#" class="navbar-logo">
    <svg viewBox="0 0 32 32" fill="none">
      <path d="M4 24 L16 4 L28 24 Z" fill="#3370ff"/>
    </svg>
    <span>MyGallery</span>
  </a>
  <div class="navbar-tabs">
    <a class="navbar-tab active" href="#">全部</a>
    <a class="navbar-tab" href="#">经验文章</a>
    <a class="navbar-tab" href="#">视频教程</a>
    <a class="navbar-tab" href="#">付费课程</a>
  </div>
  <div class="navbar-avatar"></div>
</nav>

<!-- ===== 主内容 ===== -->
<div class="container">

  <!-- 最新文章分区 -->
  <h2 class="section-title">最新文章</h2>
  <div class="card-grid" id="grid-articles"></div>
  <div class="view-all-wrap">
    <a href="#" class="view-all-btn">查看全部</a>
  </div>

  <!-- 视频教程分区 -->
  <h2 class="section-title">视频教程</h2>
  <div class="card-grid" id="grid-videos"></div>
  <div class="view-all-wrap">
    <a href="#" class="view-all-btn">查看全部</a>
  </div>

</div>

<script>
  // ============================================================
  //  【只需要修改这里】所有内容都在这里配置
  //  src    = 封面图地址（本地图片就和html放同一文件夹，填 "图片1.jpg"）
  //  href   = 点击跳转的链接
  //  title  = 卡片标题
  //  author = 作者名称
  //  date   = 日期
  //  加卡片就复制一行，删卡片就删一行
  // ============================================================

  // 最新文章
  const articles = [
    { src: "https://picsum.photos/seed/art1/640/360", href: "#", title: "AI图片模版功能上线，智能参考极速复刻", author: "官方教程组", date: "2025/12/30" },
    { src: "https://picsum.photos/seed/art2/640/360", href: "#", title: "图像模型怎么选？模型选得好生图没烦恼", author: "官方教程组", date: "2025/12/30" },
    { src: "https://picsum.photos/seed/art3/640/360", href: "#", title: "数字人功能正式上线！顶级模型免费资源", author: "官方教程组", date: "2025/12/08" },
    { src: "https://picsum.photos/seed/art4/640/360", href: "#", title: "新版图像生成器使用指南，顶尖模型优质风格", author: "官方教程组", date: "2025/10/13" },
  ];

  // 视频教程
  const videos = [
    { src: "https://picsum.photos/seed/vid1/640/360", href: "#", title: "AI精准控图3大技巧！含提示词与步骤", author: "官方教程组", date: "2025/12/30" },
    { src: "https://picsum.photos/seed/vid2/640/360", href: "#", title: "邪门但有用！零基础3分钟速通出图", author: "官方教程组", date: "2025/12/30" },
    { src: "https://picsum.photos/seed/vid3/640/360", href: "#", title: "小白也能做！AI批量生成双11电商促销素材", author: "官方教程组", date: "2025/11/07" },
    { src: "https://picsum.photos/seed/vid4/640/360", href: "#", title: "无需Ps！一个AI搞定99%的线稿提取需求", author: "官方教程组", date: "2025/11/06" },
  ];

  // 顶部导航栏（改名字和链接）
  const navTabs = [
    { name: "全部", href: "#", active: true },
    { name: "经验文章", href: "#", active: false },
    { name: "视频教程", href: "#", active: false },
    { name: "付费课程", href: "#", active: false },
  ];

  // 网站名称（改左上角Logo文字）
  const siteName = "MyGallery";

  // ============================================================
  //  下面是自动生成代码，不需要修改
  // ============================================================

  // 渲染卡片
  function renderCards(containerId, items) {
    const container = document.getElementById(containerId);
    items.forEach(item => {
      const card = document.createElement('a');
      card.className = 'card';
      card.href = item.href || '#';
      card.target = '_blank';
      card.rel = 'noopener noreferrer';
      card.innerHTML = `
        <div class="card-cover">
          <img src="${item.src}" alt="${item.title || ''}" loading="lazy">
        </div>
        <div class="card-body">
          <div class="card-title">${item.title || ''}</div>
          <div class="card-meta">
            <span class="card-author">
              <span class="card-author-avatar"></span>
              ${item.author || ''}
            </span>
            <span class="card-date">${item.date || ''}</span>
          </div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  renderCards('grid-articles', articles);
  renderCards('grid-videos', videos);

  // 更新网站名称
  document.querySelector('.navbar-logo span').textContent = siteName;

  // 渲染导航栏
  const tabsContainer = document.querySelector('.navbar-tabs');
  tabsContainer.innerHTML = '';
  navTabs.forEach(tab => {
    const a = document.createElement('a');
    a.className = 'navbar-tab' + (tab.active ? ' active' : '');
    a.href = tab.href || '#';
    a.textContent = tab.name;
    tabsContainer.appendChild(a);
  });
</script>

</body>
</html>
