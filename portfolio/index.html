<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的AI作品集｜小红书风格</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui,-apple-system,"PingFang SC",sans-serif;
}
body{
    background:#fefefe;
    color:#222;
}
.container{
    max-width:1240px;
    margin:0 auto;
    padding:32px 16px;
}
/* 个人主页头部 */
.profile{
    display:flex;
    align-items:center;
    gap:20px;
    margin-bottom:36px;
}
.avatar{
    width:90px;
    height:90px;
    border-radius:50%;
    background:#ff2442;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:32px;
    font-weight:bold;
}
.profile-info h1{
    font-size:24px;
    margin-bottom:6px;
}
.profile-desc{
    color:#666;
    font-size:15px;
    line-height:1.6;
    margin-bottom:10px;
}
.profile-tags span{
    display:inline-block;
    background:#f8f0f2;
    color:#ff2442;
    padding:4px 10px;
    border-radius:99px;
    font-size:13px;
    margin-right:8px;
}
/* 分类标签栏 */
.tab-wrap{
    display:flex;
    gap:12px;
    margin-bottom:28px;
    overflow-x:auto;
    padding-bottom:8px;
}
.tab{
    white-space:nowrap;
    padding:7px 18px;
    border-radius:99px;
    font-size:14px;
    cursor:pointer;
    border:1px solid #eee;
}
.tab.active{
    background:#ff2442;
    color:#fff;
    border-color:#ff2442;
}
/* 作品网格 小红书瀑布布局 */
.work-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:22px 16px;
}
/* 笔记卡片 */
.note-card{
    border-radius:12px;
    overflow:hidden;
    background:#fff;
    box-shadow:0 1px 6px rgba(0,0,0,0.06);
    transition:0.24s ease;
    cursor:pointer;
}
.note-card:hover{
    transform:translateY(-6px);
    box-shadow:0 10px 20px rgba(255,36,66,0.08);
}
.card-img-box{
    width:100%;
    overflow:hidden;
}
.card-img{
    width:100%;
    aspect-ratio:4/5;
    object-fit:cover;
    transition:0.3s ease;
    display:block;
}
.note-card:hover .card-img{
    transform:scale(1.05);
}
.card-text{
    padding:12px 10px;
}
.note-title{
    font-size:14.5px;
    line-height:1.45;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    margin-bottom:8px;
}
.note-label{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:12px;
    color:#999;
}
.tag-emoji{
    color:#ff2442;
}
</style>
</head>
<body>
<div class="container">
    <!-- 个人主页头部 -->
    <div class="profile">
        <div class="avatar" id="avatarDom"></div>
        <div class="profile-info">
            <h1 id="nameDom"></h1>
            <div class="profile-desc" id="bioDom"></div>
            <div class="profile-tags" id="hashDom"></div>
        </div>
    </div>
    <!-- 分类标签 -->
    <div class="tab-wrap" id="tabBox"></div>
    <!-- 作品卡片区域 -->
    <div class="work-grid" id="gridBox"></div>
</div>

<script>
// 自动读取外部data.json，页面无内置内容
fetch("./data.json")
.then(res => res.json())
.then(data => {
    // 填充个人信息
    document.getElementById("avatarDom").innerText = data.userInfo.avatarText;
    document.getElementById("nameDom").innerText = data.userInfo.userName;
    document.getElementById("bioDom").innerText = data.userInfo.bio;
    document.getElementById("hashDom").innerHTML = data.userInfo.hashTags.map(t=>`<span>${t}</span>`).join("");

    // 渲染Tab分类
    const tabBox = document.getElementById("tabBox");
    data.tabList.forEach((tab,idx)=>{
        const div = document.createElement("div");
        div.className = "tab" + (idx===0 ? " active" : "");
        div.innerText = tab;
        tabBox.appendChild(div);
    })

    // 渲染所有作品
    const gridBox = document.getElementById("gridBox");
    function renderWorks(list){
        gridBox.innerHTML = "";
        list.forEach(item=>{
            const a = document.createElement("a");
            a.className = "note-card";
            a.target = "_blank";
            a.href = item.link;
            a.innerHTML = `
                <div class="card-img-box">
                    <img class="card-img" src="${item.img}" alt="${item.title}">
                </div>
                <div class="card-text">
                    <div class="note-title">${item.title}</div>
                    <div class="note-label">
                        <span class="tag-emoji">📌 ${item.tag}</span>
                        <span>❤️ ${item.like}</span>
                    </div>
                </div>
            `;
            gridBox.appendChild(a);
        })
    }
    renderWorks(data.workData);
})
</script>
</body>
</html>
